name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify artifacts only, or publish an existing version tag
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.mode == 'publish') && 'anilili-publish' || format('anilili-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check canonical version and release ref
        id: plan
        env:
          RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
        run: python3 scripts/release_plan.py

  validate:
    needs: plan
    uses: ./.github/workflows/kmp-ci.yml
    with:
      release-version: ${{ needs.plan.outputs.version }}
      release-build: ${{ needs.plan.outputs.build }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  android-release:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ needs.plan.outputs.mode == 'publish' && 'release' || 'release-dry-run' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false
      - name: Build, test, and verify both release APKs
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_BUILD: ${{ needs.plan.outputs.build }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          ANDROID_SIGNER_CERT_SHA256: ${{ vars.ANDROID_SIGNER_CERT_SHA256 }}
          ANDROID_KEYSTORE_BASE64: ${{ needs.plan.outputs.mode == 'publish' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ needs.plan.outputs.mode == 'publish' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ needs.plan.outputs.mode == 'publish' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ needs.plan.outputs.mode == 'publish' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: bash scripts/release_android.sh
      - name: Require Android Release unit-test results
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for flavor in ("Mobile", "Tv"):
              reports = Path(f"app/build/test-results/test{flavor}ReleaseUnitTest")
              suites = [ET.parse(path).getroot() for path in reports.glob("TEST-*.xml")]
              total, skipped, failures, errors = (
                  sum(int(suite.get(key, 0)) for suite in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              )
              if total <= skipped or failures or errors:
                  raise SystemExit(f"Android {flavor} Release tests did not pass")
              print(f"{flavor} Release passed {total - skipped} tests, skipped {skipped}")
          PYTEST
      - name: Preserve Android Release test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-test-results
          path: app/build/test-results/test*ReleaseUnitTest/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [plan, validate, android-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-input
      - name: Verify the complete release and generate checksums
        env:
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_BUILD: ${{ needs.plan.outputs.build }}
        run: RELEASE_BUILD_DATE="$(date -u +%F)" python3 scripts/assemble_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.plan.outputs.mode == 'publish'
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: dist
      - name: Upload draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --strict --check SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Resolve it manually before retrying." >&2
            exit 1
          fi
          # Recheck the remote tag after approvals and builds.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          ref_type=$(jq -r '.object.type' <<< "$ref")
          ref_sha=$(jq -r '.object.sha' <<< "$ref")
          while [[ "$ref_type" == tag ]]; do
            ref=$(gh api "repos/$GH_REPO/git/tags/$ref_sha")
            ref_type=$(jq -r '.object.type' <<< "$ref")
            ref_sha=$(jq -r '.object.sha' <<< "$ref")
          done
          test "$ref_type" = commit
          test "$ref_sha" = "$GITHUB_SHA"
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" ./* --repo "$GH_REPO" --draft --verify-tag --title "Anilili $TAG" \
            --notes-file RELEASE_NOTES.md "${args[@]}"
          gh release edit "$TAG" --draft=false
