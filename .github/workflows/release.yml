# Builds both flavors and publishes them as a GitHub Release.
#
# Runs on every push to main and manually. The version — and with it the release tag — comes from
# `appVersionName`/`appVersionCode` in app/build.gradle.kts, so bumping those and pushing is the
# whole release procedure.
#
# Signing: the release keystore never lives in this repo. It is passed as the base64 secret
# ANDROID_KEYSTORE_BASE64 (plus ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD) and reassembled into keystore.properties at build time. Without those
# secrets the build still produces APKs, but signed with the debug key instead — such an APK
# cannot replace an existing release install, so it is published as a draft with a warning
# rather than as a real release.
#
# Note the app's own updater reads the Nostr manifest (scripts/nostr_update.py), not this release:
# after publishing here, `publish --version <v> --apk-url <release asset url>` keeps both channels
# pointing at the same build.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: release notes are cut from the commits since the previous tag.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.1" "platform-tools" >/dev/null

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testMobileReleaseUnitTest testTvReleaseUnitTest assembleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^val appVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/^val appVersionCode = \(.*\)$/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not read appVersionName/appVersionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobile/release/*.apk dist/
          cp app/build/outputs/apk/tv/release/*.apk dist/
          cp app/build/outputs/mapping-archive/*.txt dist/ 2>/dev/null || true
          ls -la dist/
          test -n "$(find dist -maxdepth 1 -name '*.apk' | head -n 1)"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "Anilili v$VERSION (build $CODE)"
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> ⚠️ Built **without** the release keystore: these APKs carry the debug key and"
              echo "> cannot update an existing install. Add the ANDROID_KEYSTORE_BASE64 /"
              echo "> ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets"
              echo "> and re-run this workflow to publish a signed build."
              echo
            fi
            echo "## Changes"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --oneline --no-decorate "$PREV_TAG..HEAD"
            else
              git log --oneline --no-decorate -n 30
            fi
            echo
            echo "## Assets"
            echo
            echo "- \`Anilili.apk\` — universal (any ARM device)"
            echo "- \`Anilili_arm64-v8a.apk\` / \`Anilili_armeabi-v7a.apk\` — per-ABI phone splits"
            echo "- \`Anilili_tv*.apk\` — the Fire TV build, same ABI split"
            echo "- \`mapping-*.txt\` — R8 mappings for deobfuscating crash reports from this build"
          } > release_notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its assets."
            gh release edit "$TAG" --notes-file release_notes.md
            # A draft left behind by an unsigned run becomes a real release once the keystore
            # secrets are in place.
            if [ "$SIGNED" = "true" ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            # A published release only when it is signed; an unsigned build becomes a draft so
            # nobody installs an APK that cannot update over what they already have.
            DRAFT_FLAG=""
            if [ "$SIGNED" != "true" ]; then DRAFT_FLAG="--draft"; fi
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Anilili v$VERSION" \
              --notes-file release_notes.md \
              $DRAFT_FLAG
          fi
          gh release upload "$TAG" dist/* --clobber
          {
            echo "### Release $TAG"
            echo
            gh release view "$TAG" --json url --jq '.url' | sed 's/^/- /'
            echo
            echo '```'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
