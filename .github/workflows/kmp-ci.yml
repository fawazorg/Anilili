name: Anilili CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
    - name: Shared JVM tests, Android unit tests and both debug flavors
      run: ./gradlew :shared-core:jvmTest :app:testMobileDebugUnitTest :app:testTvDebugUnitTest :app:assembleMobileDebug
        :app:assembleTvDebug -x :app:syncParityCorpus --stacktrace
    - name: Preserve test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-test-results
        path: |
          shared-core/build/reports/tests/
          app/build/reports/tests/
  apple:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
    - name: Restore Kotlin Native toolchain
      id: native-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
    - name: Inspect Xcode, project, and compatible simulators
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ios-prototype/Results
        test "$(uname -m)" = x86_64
        ls -d /Applications/Xcode*.app
        xcodebuild -version
        xcrun simctl list runtimes
        xcrun simctl list devices available
        xcodebuild -list -project ios-prototype/PlaybackPOC.xcodeproj
        xcodebuild -showdestinations -project ios-prototype/PlaybackPOC.xcodeproj -scheme PlaybackPOC
        xcrun simctl list devices available --json > ios-prototype/Results/simulators.json
        python3 - <<'PY'
        import json, os, subprocess
        with open('ios-prototype/Results/simulators.json') as f:
            devices = json.load(f)['devices']
        candidates = [(runtime, d) for runtime, group in devices.items()
                      if '.iOS-18-' in runtime for d in group
                      if d.get('isAvailable') and d['name'].startswith('iPhone')]
        if not candidates:
            raise SystemExit('Required iOS 18 simulator for Xcode 16.4 is missing.')
        runtime, device = sorted(candidates, key=lambda pair: (pair[0], pair[1]['name']))[-1]
        print(f"Selected {runtime}: {device['name']} ({device['udid']})")
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"IOS_SIMULATOR_UDID={device['udid']}\n")
        # Begin booting while Gradle compiles the framework; readiness is checked below.
        if device['state'] != 'Booted':
            subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
        PY
    - name: Link shared catalog, episodes, and playback framework
      run: ./gradlew :shared-core:linkDebugFrameworkIosX64 --stacktrace
    - name: Check fixture server and wait for simulator
      shell: bash
      run: |
        set -euo pipefail
        python3 -m unittest discover -s ios-prototype/ci -p 'test_*.py'
        xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
    - name: Run common tests on iOS x64 simulator
      run: ./gradlew :shared-core:iosX64Test -PiosSimulatorDeviceId="$IOS_SIMULATOR_UDID" --stacktrace
    - name: Require simulator test results
      shell: bash
      run: |
        python3 - <<'PYTEST'
        from pathlib import Path
        import xml.etree.ElementTree as ET
        reports = list(Path('shared-core/build/test-results/iosX64Test').glob('TEST-*.xml'))
        suites = [ET.parse(p).getroot() for p in reports]
        executed = sum(int(s.get('tests', '0')) - int(s.get('skipped', '0')) for s in suites)
        failures = sum(int(s.get('failures', '0')) + int(s.get('errors', '0')) for s in suites)
        skipped = sum(int(s.get('skipped', '0')) for s in suites)
        if executed <= 0 or failures or skipped:
            raise SystemExit(f'iOS simulator validation failed: executed={executed}, failures/errors={failures}, skipped={skipped}')
        print(f'iOS simulator tests executed: {executed}')
        PYTEST
    - name: Save validated Kotlin Native toolchain before playback tests
      if: steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.konan
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - name: Verify provider compatibility, playback, history and restart journeys
      shell: bash
      run: |
        set -euo pipefail
        python3 -u ios-prototype/ci/serve_fixtures.py > ios-prototype/Results/fixture-server.log 2>&1 &
        fixture_pid=$!
        trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
        for attempt in {1..20}; do
          kill -0 "$fixture_pid"
          if curl --fail --silent http://127.0.0.1:8765/hls/master.m3u8 > /dev/null; then break; fi
          sleep 1
        done
        curl --fail --silent http://127.0.0.1:8765/progressive.mp4 > /dev/null
        test_build="$RUNNER_TEMP/PlaybackTests"
        xcodebuild build-for-testing -project ios-prototype/PlaybackPOC.xcodeproj -scheme PlaybackPOC \
          -configuration Debug -sdk iphonesimulator \
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID,arch=x86_64" \
          -derivedDataPath "$test_build" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
          2>&1 | tee ios-prototype/Results/test-build.log
        test_app="$test_build/Build/Products/Debug-iphonesimulator/PlaybackPOC.app"
        # Keep Xcode's host-valid signature. Simulator claims live in __TEXT,__entitlements;
        # copying iOS claims into the host signature causes a Taskgated launch rejection.
        codesign --verify --deep --strict "$test_app"
        python3 ios-prototype/ci/verify_simulator_signing.py \
          "$test_app/PlaybackPOC" org.anilili.playbackpoc --mach-o \
          --output ios-prototype/Results/test-host-entitlements.plist
        xcrun simctl install "$IOS_SIMULATOR_UDID" "$test_app"
        xcrun simctl launch --terminate-running-process "$IOS_SIMULATOR_UDID" org.anilili.playbackpoc \
          2>&1 | tee ios-prototype/Results/launch-smoke.log
        xcrun simctl terminate "$IOS_SIMULATOR_UDID" org.anilili.playbackpoc
        # Fail quickly on the active HLS regression; a successful preflight still requires
        # the complete suite and its zero-skipped/missing-test guard below.
        xcodebuild test-without-building -project ios-prototype/PlaybackPOC.xcodeproj -scheme PlaybackPOC \
          -configuration Debug -sdk iphonesimulator \
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID,arch=x86_64" \
          -derivedDataPath "$test_build" -parallel-testing-enabled NO \
          -only-testing:PlaybackPOCTests/OfflineDownloadTests/testHLSNativePackagePlaysAfterItsOriginIsDisabled \
          -resultBundlePath ios-prototype/Results/HLSPreflight.xcresult \
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee ios-prototype/Results/hls-preflight.log
        xcodebuild test-without-building -project ios-prototype/PlaybackPOC.xcodeproj -scheme PlaybackPOC \
          -configuration Debug -sdk iphonesimulator \
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID,arch=x86_64" \
          -derivedDataPath "$test_build" \
          -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
          -resultBundlePath ios-prototype/Results/Playback.xcresult \
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee ios-prototype/Results/xcodebuild.log
        kill -0 "$fixture_pid"
        xcrun xcresulttool get test-results summary --path ios-prototype/Results/Playback.xcresult \
          > ios-prototype/Results/test-summary.json
        python3 ios-prototype/ci/verify_results.py ios-prototype/Results/test-summary.json
    - name: Link Release frameworks for simulator and physical iPhone
      run: ./gradlew :shared-core:linkReleaseFrameworkIosX64 :shared-core:linkReleaseFrameworkIosArm64 --stacktrace
    - name: Validate unsigned Release simulator and device builds
      shell: bash
      run: |
        set -euo pipefail
        for platform in Simulator Device; do
          if [[ "$platform" == Simulator ]]; then
            sdk=iphonesimulator
            destination='generic/platform=iOS Simulator'
          else
            sdk=iphoneos
            destination='generic/platform=iOS'
          fi
          build_directory="$RUNNER_TEMP/PlaybackRelease$platform"
          xcodebuild build -project ios-prototype/PlaybackPOC.xcodeproj -scheme PlaybackPOC \
            -configuration Release -sdk "$sdk" -destination "$destination" \
            -derivedDataPath "$build_directory" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "ios-prototype/Results/release-$platform.log"
          xcodebuild -showBuildSettings -json -project ios-prototype/PlaybackPOC.xcodeproj \
            -scheme PlaybackPOC -configuration Release -sdk "$sdk" -destination "$destination" \
            CODE_SIGNING_ALLOWED=NO > "ios-prototype/Results/release-$platform-settings.json"
          python3 ios-prototype/ci/verify_release_settings.py \
            "ios-prototype/Results/release-$platform-settings.json" "$sdk"
          app="$build_directory/Build/Products/Release-$sdk/PlaybackPOC.app"
          test -f "$app/PrivacyInfo.xcprivacy"
          # Retain symbols for manual required-reason API auditing; this is not App Store approval.
          xcrun nm -u "$app/PlaybackPOC" > "ios-prototype/Results/release-$platform-undefined-symbols.txt"
        done
    - name: Preserve native, playback and history results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apple-test-results
        path: |-
          ios-prototype/Results/
          shared-core/build/reports/tests/
          shared-core/build/test-results/
        retention-days: 7
