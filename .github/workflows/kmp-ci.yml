name: KMP Phase 1

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect shared and Android tasks
        run: ./gradlew :shared-core:tasks :app:tasks --all --console=plain
      - name: Shared JVM tests
        run: ./gradlew :shared-core:jvmTest --stacktrace
      # preBuild normally refreshes committed fixtures from a sibling checkout.
      # CI uses the committed corpus without modifying source resources.
      - name: Android unit tests and both debug flavors
        run: >-
          ./gradlew :app:testMobileDebugUnitTest :app:testTvDebugUnitTest
          :app:assembleMobileDebug :app:assembleTvDebug
          -x :app:syncParityCorpus --stacktrace
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: |
            shared-core/build/reports/tests/
            app/build/reports/tests/

  apple:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect Xcode and simulator requirements
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
          test "$(uname -m)" = x86_64
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as f:
              devices = json.load(f)['devices']
          candidates = [(runtime, d) for runtime, group in devices.items()
                        if '.iOS-' in runtime for d in group
                        if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('Required available iOS iPhone simulator missing; simulator tests cannot run.')
          runtime, device = sorted(candidates, key=lambda item: (item[0], item[1]['name']))[-1]
          print(f"Selected {runtime}: {device['name']} ({device['udid']})")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"IOS_SIMULATOR_UDID={device['udid']}\n")
          PY
      - name: Inspect Native tasks
        run: ./gradlew :shared-core:tasks --all --console=plain
      - name: Link iOS x64 simulator framework
        run: ./gradlew :shared-core:linkDebugFrameworkIosX64 --stacktrace
      - name: Boot required simulator
        shell: bash
        run: |
          set -euo pipefail
          state=$(xcrun simctl list devices available --json | python3 -c 'import json,os,sys; print(next(d["state"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["udid"] == os.environ["IOS_SIMULATOR_UDID"]))')
          if [ "$state" != Booted ]; then
            xcrun simctl boot "$IOS_SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
      - name: Run common tests on iOS x64 simulator
        run: ./gradlew :shared-core:iosX64Test -PiosSimulatorDeviceId="$IOS_SIMULATOR_UDID" --stacktrace
      - name: Require simulator test results
        shell: bash
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('shared-core/build/test-results/iosX64Test').glob('TEST-*.xml'))
          suites = [ET.parse(p).getroot() for p in reports]
          executed = sum(int(s.get('tests', '0')) - int(s.get('skipped', '0')) for s in suites)
          failures = sum(int(s.get('failures', '0')) + int(s.get('errors', '0')) for s in suites)
          skipped = sum(int(s.get('skipped', '0')) for s in suites)
          if executed <= 0 or failures or skipped:
              raise SystemExit(f'iOS simulator validation failed: executed={executed}, failures/errors={failures}, skipped={skipped}')
          print(f'iOS simulator tests executed: {executed}')
          PYTEST
      - name: Preserve Native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-results
          path: shared-core/build/reports/tests/
